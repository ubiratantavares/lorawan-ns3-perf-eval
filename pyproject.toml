[project]
name = "lorawan-ns3-perf-eval"
version = "0.1.0"
description = "Avaliação de desempenho de redes LoRaWAN em ns-3 com orquestração e análise estatística em Python (Arquitetura Hexagonal, SDD, Raj Jain)."
readme = "README.md"
authors = [
    { name = "Ubiratan Tavares", email = "ust1973@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib",
    "numpy",
    "pandas",
    "pyyaml",
    "scipy",
    "seaborn",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

# Os pacotes hexagonais vivem em src/{core,ports,adapters}; o pacote
# distribuível é "src", mantendo os imports `src.core`, `src.ports`, `src.adapters`.
[tool.uv.build-backend]
module-root = ""
module-name = "src"

[dependency-groups]
dev = [
    "mdformat",
    "mypy",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
